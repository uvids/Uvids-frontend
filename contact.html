<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Uvids</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { background-color: #05070e; color: #f3f4f6; font-family: 'Inter', sans-serif; padding: 20px; line-height: 1.7; display: flex; justify-content: center; }
        .container { max-width: 500px; width: 100%; background: #111420; padding: 30px; border-radius: 20px; border: 1px solid #1f2436; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; }
        h1 { color: #a855f7; margin-bottom: 20px; font-size: 24px; font-weight: 600; }
        p { color: #9ca3af; margin-bottom: 15px; font-size: 15px; }
        .email-box { background: #03050a; padding: 15px; border-radius: 10px; border: 1px solid #1f2436; margin: 20px 0; font-weight: 600; color: #38bdf8; font-size: 18px; }
        .back-btn { display: inline-block; margin-top: 10px; padding: 12px 20px; background: #6366f1; color: white; text-decoration: none; border-radius: 10px; font-weight: 600; text-align: center; transition: 0.3s; }
        .back-btn:hover { background: #4f46e5; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Contact Us</h1>
        <p>If you have any questions, feedback, or business inquiries, feel free to reach out to us.</p>
        <p>We usually reply within 24-48 hours.</p>
        
        <div class="email-box">
            support@uvids.com
        </div>
        <p style="font-size: 12px; color: #6b7280;">(Note: Replace this with your real email address)</p>

        <a href="index.html" class="back-btn">← Back to Home</a>
    </div>
</body>
</html>
