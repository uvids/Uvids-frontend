<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Uvids</title>
    <!-- Font link for clean look -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { background-color: #05070e; color: #f3f4f6; font-family: 'Inter', sans-serif; padding: 20px; line-height: 1.7; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { max-width: 500px; width: 100%; background: #111420; padding: 30px; border-radius: 20px; border: 1px solid #1f2436; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { color: #a855f7; margin-bottom: 10px; font-size: 24px; text-align: center; }
        p.subtitle { text-align: center; color: #9ca3af; margin-bottom: 25px; font-size: 14px; }
        
        /* Form Styling */
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #e2e8f0; margin-bottom: 5px; }
        input, textarea { 
            width: 100%; padding: 14px; background: #03050a; border: 1px solid #1f2436; 
            border-radius: 10px; color: white; font-size: 14px; outline: none; transition: 0.3s; font-family: 'Inter', sans-serif; box-sizing: border-box;
        }
        input:focus, textarea:focus { border-color: #6366f1; box-shadow: 0 0 10px rgba(99, 102, 241, 0.2); }
        textarea { resize: vertical; min-height: 100px; }
        
        .submit-btn { 
            width: 100%; padding: 14px; background: #6366f1; color: white; 
            border: none; border-radius: 10px; font-size: 15px; font-weight: 600; 
            cursor: pointer; transition: 0.3s; margin-top: 10px;
        }
        .submit-btn:hover { background: #4f46e5; }
        
        .back-btn { display: block; text-align: center; margin-top: 20px; color: #9ca3af; text-decoration: none; font-size: 14px; transition: 0.3s; }
        .back-btn:hover { color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Contact Us</h1>
        <p class="subtitle">Have a question or feedback? Send us a message!</p>
        
        <!-- Form Start -->
        <form action="https://api.web3forms.com/submit" method="POST">
            
            <!-- AAPKI KEY YAHAN LAG GAYI HAI -->
            <input type="hidden" name="access_key" value="bc451b3f-2f62-4ee5-b84e-060b416fb62e">
            
            <!-- Email Subject aur Sender -->
            <input type="hidden" name="subject" value="New Message from Uvids Contact Form">
            <input type="hidden" name="from_name" value="Uvids Website">

            <!-- Spam Protection -->
            <input type="checkbox" name="botcheck" class="hidden" style="display: none;">

            <div class="form-group">
                <label>Your Name</label>
                <input type="text" name="name" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label>Your Email</label>
                <input type="email" name="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label>Message</label>
                <textarea name="message" placeholder="How can we help you?" required></textarea>
            </div>

            <button type="submit" class="submit-btn">Send Message</button>
        </form>
        <!-- Form End -->
        
        <a href="index.html" class="back-btn">← Back to Home</a>
    </div>
</body>
</html>
